<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kolby Hunt — Creative Technologist. Interactive experiences, creative technology, and things that make you look twice.">
    <meta name="theme-color" content="#101a1c">
    <title>Hunt Your Vizion | Kolby Hunt</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main id="website">
        <header class="site-header">
            <h1>HUNT YOUR VIZION</h1>
            <p>Creative Technologist <span aria-hidden="true">|</span> Kolby Hunt</p>
        </header>

        <section class="game-screen" id="gameScreen" aria-label="Interactive portfolio">
            <div class="intro" id="intro">
                <button class="explore-button" id="exploreButton" type="button">
                    <span>EXPLORE</span>
                    <span class="button-hint">CLICK TO ENTER</span>
                </button>
            </div>

            <div class="world" id="world" aria-label="A small interactive workspace">
                <div class="wall">
                    <div class="wall-panel wall-panel-left"></div>
                    <div class="wall-panel wall-panel-right"></div>
                </div>

                <div class="scene">
                    <button class="scene-object bulletin-board" data-hover-text="FILMS" type="button" aria-label="Films">
                        <span class="board-pins"></span>
                    </button>

                    <button class="scene-object book" data-hover-text="INTERACTIVES" type="button" aria-label="Interactive projects">
                        <span class="book-cover"></span>
                    </button>

                    <button class="scene-object lamp" type="button" aria-label="Decorative lamp">
                        <span class="lamp-shade"></span>
                        <span class="lamp-stem"></span>
                        <span class="lamp-base"></span>
                    </button>

                    <button class="scene-object drawer" data-hover-text="FABRICATIONS" type="button" aria-label="Fabrications">
                        <span class="drawer-handle"></span>
                    </button>

                    <div class="desk-top" aria-hidden="true"></div>
                </div>

                <div class="hover-text" id="hoverText" aria-live="polite"></div>
            </div>
        </section>

        <footer class="site-footer">
            <p>© 2026 Kolby Hunt</p>
        </footer>
    </main>
</body>
</html>
