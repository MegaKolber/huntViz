name: Update project catalog

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'scripts/build_projects.py'
      - '.github/workflows/build-projects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog
        run: python scripts/build_projects.py
      - name: Commit updated catalog if needed
        run: |
          if ! git diff --quiet -- projects.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json
            git commit -m "Update generated project catalog"
            git push
          fi
